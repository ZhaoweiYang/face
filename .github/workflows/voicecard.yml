# VoiceCard: test on every push / PR; deploy the Cloudflare Worker (API + card page)
# on pushes to the default branch or when run manually.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   token with "Workers Scripts: Edit" and "D1: Edit"
#   CLOUDFLARE_ACCOUNT_ID  your Cloudflare account ID
# See voicecard/worker/README.md.

name: VoiceCard

on:
  push:
    paths: ["voicecard/**", ".github/workflows/voicecard.yml"]
  pull_request:
    paths: ["voicecard/**", ".github/workflows/voicecard.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python server tests
        working-directory: voicecard
        run: |
          pip install -r requirements-dev.txt
          python -m pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: voicecard/worker/package-lock.json
      - run: npm ci
        working-directory: voicecard/worker
      - name: Worker typecheck
        working-directory: voicecard/worker
        run: npm run typecheck
      - name: Worker API tests (wrangler dev, local D1/R2)
        working-directory: voicecard/worker
        run: npm test

  deploy:
    needs: test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    concurrency: voicecard-deploy
    environment:
      name: cloudflare
      url: ${{ steps.deploy.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under Settings → Secrets and variables → Actions (see voicecard/worker/README.md)."
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: voicecard/worker/package-lock.json
      - run: npm ci
        working-directory: voicecard/worker

      - name: Apply D1 migrations
        working-directory: voicecard/worker
        run: npx wrangler d1 migrations apply voicecard-db --remote

      - name: Deploy Worker
        id: deploy
        working-directory: voicecard/worker
        run: |
          npx wrangler deploy | tee deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -n1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Deployed to $url" >> "$GITHUB_STEP_SUMMARY"
